{% extends 'core/base.html' %}{% block content %}<div class="page-heading"><div><div class="eyebrow">OPERATIONS / {{ resource|upper }}</div><h1>{{ object }}</h1><p>Record details and audit-managed operational data.</p></div><div class="detail-actions"><a class="button" href="{% url 'resource_edit' resource object.pk %}">EDIT</a><a class="button danger-button" href="{% url 'resource_delete' resource object.pk %}">DELETE</a></div></div><section class="panel detail-grid">{% for label,value in fields %}<div><span class="eyebrow">{{ label }}</span><p>{{ value|default:'—' }}</p></div>{% endfor %}</section><a class="text-link" href="{% url 'resource_list' resource %}">← BACK TO {{ resource|upper }}</a>{% endblock %}
