[project]
name = "polarops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<6",
  "djangorestframework>=3.15",
  "django-simple-history>=3.7",
  "qrcode[pil]>=8",
  "reportlab>=4",
  "psycopg[binary]>=3.2",
  "gunicorn>=23",
]

[tool.vercel.scripts]
build = "python manage.py migrate --noinput && python manage.py seed_polarops"
